<!-- post_detail.html -->
<h1>{{ post.title }}</h1>
<p>{{ post.content }}</p>
<small>By {{ post.author.username }} on {{ post.created_at }}</small>

{% if user == post.author %}
    <a href="{% url 'post_update' post.pk %}">Edit</a>
    <a href="{% url 'post_delete' post.pk %}">Delete</a>
{% endif %}
<a href="{% url 'blog_home' %}">Back to all posts</a>
